$schema: /Users/michielnijenhuis/Code/cli/cli.schema.json

name: clitest
description: A test command for debugging purposes of the CLI library

theme:
  primary: yellow
  secondary: red

commands:
  db:restore:
    description: Restore the database

  hello:
    description: Say hello
    args:
      name:
        description: Your name
        required: true
    flags:
      exclamate:
        description: Say hello in an exclamation mark
        default: false
        aliases:
          - e
      greeting:
        description: The greeting to use
        default: Hello
        aliases:
          - g

  lines:
    description: Tail the staging server logs
    flags:
      number-of-lines:
        aliases:
          - l
        description: The initial number of lines to show
        default: 1000

  a:c:
    description: A:C
  a:b:c:
    description: A:B:C
  a:b:d:
    description: A:B:D

  input:
    description: Test input

  choose:
    description: Test choose

  foo:
    description: Test gum

noNativeFlags: true
